
spring.application.name=ShopSmartAI

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:54959/shopsmart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ollama Chat Model
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.ollama.chat.options.temperature=0.7

# Ollama Embedding Model
spring.ai.ollama.embedding.options.model=nomic-embed-text

# PGVector Configuration
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=768

# SQL Initialization
spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=always
logging.level.org.springframework.jdbc.datasource.init=DEBUG
spring.jpa.defer-datasource-initialization=true

# Multipart Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Bean Configuration
spring.main.allow-bean-definition-overriding=true


# Disable automatic Docker Compose startup
spring.docker.compose.enabled=false
spring.ai.vectorstore.pgvector.enabled=false
