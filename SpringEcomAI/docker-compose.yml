
services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=shopsmart'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USERNAME:-postgres}'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
